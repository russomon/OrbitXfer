[package]
name = "orbitxfer-iroh-tauri"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orbitxfer_iroh_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Aggressive size-optimized release profile (v0.1.81+). Matches the
# settings in OrbitXfer-iroh-cli/Cargo.toml — see the comments there
# for the rationale and trade-offs.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
# Cross-platform sleep inhibitor. macOS uses IOKit's
# kIOPMAssertionTypeNoIdleSleep, Windows uses SetThreadExecutionState,
# Linux uses systemd-logind's Inhibit("sleep:idle"). One handle, three
# OSes — released when dropped.
keepawake = "0.5"
# v0.1.86 — used by the `check_disk_space` Tauri command for the
# receive-side disk-space preflight check. Cross-platform free-byte
# query (statvfs on Unix, GetDiskFreeSpaceEx on Windows). Same crate
# the CLI already uses for the same purpose.
fs2 = "0.4"

