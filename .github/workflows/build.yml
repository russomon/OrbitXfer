name: Build OrbitXfer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    if: "!contains(github.ref, '-binary')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64). Add macos-13 to also
        # produce an Intel (x86_64) Mac DMG. Both run through the same
        # signing + notarization steps so we get two signed Mac DMGs per
        # tag release. Windows and Linux are single-arch builds.
        os: [macos-latest, macos-13, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: OrbitXfer-iroh-tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            OrbitXfer-iroh-cli/target
            OrbitXfer-iroh-tauri/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('OrbitXfer-iroh-cli/Cargo.lock', 'OrbitXfer-iroh-tauri/src-tauri/Cargo.lock') }}

      - name: Install Linux deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2

      - name: Verify RELEASES.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          grep -q "^## ${tag} " RELEASES.md || (echo "RELEASES.md missing entry for ${tag}" && exit 1)

      - name: Build CLI (release)
        working-directory: OrbitXfer-iroh-cli
        run: cargo build --release

      - name: Install Tauri app deps
        working-directory: OrbitXfer-iroh-tauri
        run: npm ci

      - name: Sync CLI into Tauri sidecar slot
        working-directory: OrbitXfer-iroh-tauri
        run: npm run sync:cli

      - name: Prepare macOS signing inputs
        # Only on tag pushes: signed+notarized builds are for releases.
        # Regular pushes/PRs use ad-hoc signing — no Apple notary round
        # trip, CI stays fast.
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          signing_ready=false
          notarization_ready=false

          # Tauri 2's bundler reads APPLE_CERTIFICATE (base64 .p12 contents)
          # + APPLE_CERTIFICATE_PASSWORD, where electron-builder used CSC_LINK
          # + CSC_KEY_PASSWORD. Same secret values, different env var names.
          # Map them here so the existing GitHub repo secrets carry over
          # without requiring a rename.
          if [[ -n "${CSC_LINK_SECRET}" && -n "${CSC_KEY_PASSWORD_SECRET}" ]]; then
            echo "APPLE_CERTIFICATE=${CSC_LINK_SECRET}" >> "${GITHUB_ENV}"
            echo "APPLE_CERTIFICATE_PASSWORD=${CSC_KEY_PASSWORD_SECRET}" >> "${GITHUB_ENV}"
            signing_ready=true
          else
            echo "macOS code-signing secrets not configured; build will remain unsigned."
          fi

          if [[ -n "${APPLE_API_KEY_SECRET}" && -n "${APPLE_API_KEY_ID_SECRET}" && -n "${APPLE_API_ISSUER_SECRET}" ]]; then
            key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID_SECRET}.p8"
            printf '%s' "${APPLE_API_KEY_SECRET}" > "${key_path}"
            chmod 600 "${key_path}"
            # Tauri's bundler env var naming differs from electron-builder's:
            #   APPLE_API_KEY      = the 10-char Key ID (NOT a file path)
            #   APPLE_API_KEY_PATH = absolute path to the .p8 file
            # The existing GitHub repo secret `APPLE_API_KEY` holds the .p8
            # contents (matching electron-builder convention); we write
            # those contents to a temp file and pass its path via
            # APPLE_API_KEY_PATH. The Key ID goes into APPLE_API_KEY.
            echo "APPLE_API_KEY=${APPLE_API_KEY_ID_SECRET}" >> "${GITHUB_ENV}"
            echo "APPLE_API_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"
            echo "APPLE_API_ISSUER=${APPLE_API_ISSUER_SECRET}" >> "${GITHUB_ENV}"
            notarization_ready=true
          else
            echo "macOS notarization secrets not configured; build will not be notarized."
          fi

          echo "ORBITXFER_MAC_SIGNING_READY=${signing_ready}" >> "${GITHUB_ENV}"
          echo "ORBITXFER_MAC_NOTARIZATION_READY=${notarization_ready}" >> "${GITHUB_ENV}"

      - name: Require macOS signing for tagged releases
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          [[ "${ORBITXFER_MAC_SIGNING_READY}" == "true" ]] || (echo "Tagged macOS releases require CSC_LINK and CSC_KEY_PASSWORD secrets." && exit 1)
          [[ "${ORBITXFER_MAC_NOTARIZATION_READY}" == "true" ]] || (echo "Tagged macOS releases require APPLE_API_KEY, APPLE_API_KEY_ID, and APPLE_API_ISSUER secrets." && exit 1)

      - name: Build Tauri bundle
        working-directory: OrbitXfer-iroh-tauri
        run: npm run tauri build

      - name: Verify signed + notarized app (mac)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        working-directory: OrbitXfer-iroh-tauri
        run: npm run verify:mac:release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # Include arch so the two macOS matrix entries (arm64 + x64)
          # don't collide on the same artifact name.
          name: OrbitXfer-${{ runner.os }}-${{ runner.arch }}
          # Pick up every user-installable artifact format Tauri's bundler
          # might produce. Missing globs (e.g. .msi on Linux) are silently
          # ignored by upload-artifact.
          path: |
            OrbitXfer-iroh-tauri/src-tauri/target/release/bundle/dmg/*.dmg
            OrbitXfer-iroh-tauri/src-tauri/target/release/bundle/nsis/*.exe
            OrbitXfer-iroh-tauri/src-tauri/target/release/bundle/msi/*.msi
            OrbitXfer-iroh-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            OrbitXfer-iroh-tauri/src-tauri/target/release/bundle/deb/*.deb
            OrbitXfer-iroh-tauri/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-binary')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
