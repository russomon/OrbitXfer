name: Build OrbitXfer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    if: "!contains(github.ref, '-binary')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest = Apple Silicon. We cross-compile the Intel slice
        # on this same runner and lipo-merge into a single universal2 .app
        # so one signed/notarized DMG installs on both Mac archs. This
        # avoids the (now-starved) macos-13 Intel runner queue entirely.
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: OrbitXfer-iroh-tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            OrbitXfer-iroh-cli/target
            OrbitXfer-iroh-tauri/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('OrbitXfer-iroh-cli/Cargo.lock', 'OrbitXfer-iroh-tauri/src-tauri/Cargo.lock') }}

      - name: Install Linux deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2

      - name: Verify RELEASES.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          grep -q "^## ${tag} " RELEASES.md || (echo "RELEASES.md missing entry for ${tag}" && exit 1)

      - name: Build CLI (release)
        working-directory: OrbitXfer-iroh-cli
        run: cargo build --release

      - name: Install Tauri app deps
        working-directory: OrbitXfer-iroh-tauri
        run: npm ci

      - name: Sync CLI into Tauri sidecar slot
        working-directory: OrbitXfer-iroh-tauri
        run: npm run sync:cli

      - name: Prepare macOS signing inputs
        # Only on tag pushes: signed+notarized builds are for releases.
        # Regular pushes/PRs use ad-hoc signing — no Apple notary round
        # trip, CI stays fast.
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          signing_ready=false
          notarization_ready=false

          # Tauri 2's bundler reads APPLE_CERTIFICATE (base64 .p12 contents)
          # + APPLE_CERTIFICATE_PASSWORD, where electron-builder used CSC_LINK
          # + CSC_KEY_PASSWORD. Same secret values, different env var names.
          # Map them here so the existing GitHub repo secrets carry over
          # without requiring a rename.
          if [[ -n "${CSC_LINK_SECRET}" && -n "${CSC_KEY_PASSWORD_SECRET}" ]]; then
            echo "APPLE_CERTIFICATE=${CSC_LINK_SECRET}" >> "${GITHUB_ENV}"
            echo "APPLE_CERTIFICATE_PASSWORD=${CSC_KEY_PASSWORD_SECRET}" >> "${GITHUB_ENV}"
            signing_ready=true
          else
            echo "macOS code-signing secrets not configured; build will remain unsigned."
          fi

          if [[ -n "${APPLE_API_KEY_SECRET}" && -n "${APPLE_API_KEY_ID_SECRET}" && -n "${APPLE_API_ISSUER_SECRET}" ]]; then
            key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID_SECRET}.p8"
            printf '%s' "${APPLE_API_KEY_SECRET}" > "${key_path}"
            chmod 600 "${key_path}"
            # Tauri's bundler env var naming differs from electron-builder's:
            #   APPLE_API_KEY      = the 10-char Key ID (NOT a file path)
            #   APPLE_API_KEY_PATH = absolute path to the .p8 file
            # The existing GitHub repo secret `APPLE_API_KEY` holds the .p8
            # contents (matching electron-builder convention); we write
            # those contents to a temp file and pass its path via
            # APPLE_API_KEY_PATH. The Key ID goes into APPLE_API_KEY.
            echo "APPLE_API_KEY=${APPLE_API_KEY_ID_SECRET}" >> "${GITHUB_ENV}"
            echo "APPLE_API_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"
            echo "APPLE_API_ISSUER=${APPLE_API_ISSUER_SECRET}" >> "${GITHUB_ENV}"
            notarization_ready=true
          else
            echo "macOS notarization secrets not configured; build will not be notarized."
          fi

          echo "ORBITXFER_MAC_SIGNING_READY=${signing_ready}" >> "${GITHUB_ENV}"
          echo "ORBITXFER_MAC_NOTARIZATION_READY=${notarization_ready}" >> "${GITHUB_ENV}"

      - name: Require macOS signing for tagged releases
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          [[ "${ORBITXFER_MAC_SIGNING_READY}" == "true" ]] || (echo "Tagged macOS releases require CSC_LINK and CSC_KEY_PASSWORD secrets." && exit 1)
          [[ "${ORBITXFER_MAC_NOTARIZATION_READY}" == "true" ]] || (echo "Tagged macOS releases require APPLE_API_KEY, APPLE_API_KEY_ID, and APPLE_API_ISSUER secrets." && exit 1)

      # ----------------------------------------------------------------
      # macOS universal2 prep: lipo-merge an x86_64 + aarch64 CLI sidecar
      # so Tauri's `--target universal-apple-darwin` finds a fat-binary
      # sidecar named `<name>-universal-apple-darwin`. Runs only on mac.
      # ----------------------------------------------------------------
      - name: Add x86_64-apple-darwin Rust target (mac)
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Build universal2 CLI sidecars (mac)
        if: runner.os == 'macOS'
        working-directory: OrbitXfer-iroh-cli
        run: |
          set -euo pipefail
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          BIN_DIR=../OrbitXfer-iroh-tauri/src-tauri/binaries
          mkdir -p "$BIN_DIR"
          # Tauri's `--target universal-apple-darwin` compiles each arch
          # slice SEPARATELY, and during each slice's build the tauri-build
          # build script looks up the sidecar at the slice's own triple
          # (`<name>-x86_64-apple-darwin` then `<name>-aarch64-apple-darwin`),
          # NOT the universal one. Provide all three:
          cp target/x86_64-apple-darwin/release/orbitxfer-iroh-cli \
             "$BIN_DIR/orbitxfer-iroh-cli-x86_64-apple-darwin"
          cp target/aarch64-apple-darwin/release/orbitxfer-iroh-cli \
             "$BIN_DIR/orbitxfer-iroh-cli-aarch64-apple-darwin"
          lipo -create \
            target/x86_64-apple-darwin/release/orbitxfer-iroh-cli \
            target/aarch64-apple-darwin/release/orbitxfer-iroh-cli \
            -output "$BIN_DIR/orbitxfer-iroh-cli-universal-apple-darwin"
          chmod +x "$BIN_DIR"/orbitxfer-iroh-cli-*
          # Tauri's beforeBuildCommand runs `npm run sync:cli`, which looks
          # for the CLI at OrbitXfer-iroh-cli/target/release/orbitxfer-iroh-cli
          # (no target triple). Our --target builds above put binaries
          # under target/<triple>/release/, so that path is empty. Place
          # the host-arch (aarch64) binary there so sync:cli succeeds and
          # writes the same content into the aarch64 sidecar slot (idempotent).
          mkdir -p target/release
          cp target/aarch64-apple-darwin/release/orbitxfer-iroh-cli target/release/orbitxfer-iroh-cli
          echo "=== sidecar arches ==="
          for f in "$BIN_DIR"/orbitxfer-iroh-cli-*; do
            file "$f"
          done

      # The Cargo cache (above) covers OrbitXfer-iroh-tauri/src-tauri/target,
      # which includes the `bundle/` output dir Tauri writes installers to.
      # Without this clean, a cached `bundle/` from a previous version's
      # successful build (e.g. v0.1.76's Win/Linux DMG/MSI/deb/rpm) sticks
      # around and gets glob-uploaded alongside the freshly-built ones.
      # Cache key only hashes Cargo.lock, so it survives version bumps.
      # Cross-platform via `shell: bash`.
      - name: Clean stale bundle outputs
        shell: bash
        run: |
          rm -rf OrbitXfer-iroh-tauri/src-tauri/target/release/bundle
          rm -rf OrbitXfer-iroh-tauri/src-tauri/target/universal-apple-darwin/release/bundle

      - name: Build Tauri bundle (mac universal2)
        if: runner.os == 'macOS'
        working-directory: OrbitXfer-iroh-tauri
        run: npm run tauri -- build --target universal-apple-darwin

      - name: Build Tauri bundle (win/linux)
        if: runner.os != 'macOS'
        working-directory: OrbitXfer-iroh-tauri
        run: npm run tauri build

      - name: Verify signed + notarized app (mac)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        working-directory: OrbitXfer-iroh-tauri
        run: npm run verify:mac:release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrbitXfer-${{ runner.os }}
          # Pick up every user-installable artifact format Tauri's bundler
          # might produce. Missing globs (e.g. .msi on Linux) are silently
          # ignored by upload-artifact. The `universal-apple-darwin/`
          # path is where Tauri's --target lands the mac DMG.
          path: |
            OrbitXfer-iroh-tauri/src-tauri/target/release/bundle/dmg/*.dmg
            OrbitXfer-iroh-tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            OrbitXfer-iroh-tauri/src-tauri/target/release/bundle/nsis/*.exe
            OrbitXfer-iroh-tauri/src-tauri/target/release/bundle/msi/*.msi
            OrbitXfer-iroh-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            OrbitXfer-iroh-tauri/src-tauri/target/release/bundle/deb/*.deb
            OrbitXfer-iroh-tauri/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-binary')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
